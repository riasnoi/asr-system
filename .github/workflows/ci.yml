name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Black
        run: uv run black --check .

      - name: Isort
        run: uv run isort --check-only .

      - name: Flake8
        run: uv run flake8 src tests services

      - name: Pylint
        run: uv run pylint --disable=C0415,W0511 src/asr_system services/batch/main.py services/online/main.py

      - name: Mypy
        run: uv run mypy src

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Pytest with coverage
        run: uv run pytest

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Smoke test online API
        env:
          ONLINE_API_HOST: 127.0.0.1
          ONLINE_API_PORT: 8080
        run: |
          PYTHONPATH=src uv run python services/online/main.py &
          API_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/calls
          kill ${API_PID}

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Build batch image
        run: docker build -f Dockerfile.batch -t asr-batch:ci .

      - name: Build online image
        run: docker build -f Dockerfile.online -t asr-online:ci .

      - name: Build airflow image
        run: docker build -f Dockerfile.airflow -t asr-airflow:ci .
