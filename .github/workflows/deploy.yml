name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Release Images"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      online_image_tag:
        description: "Online image tag (sha-xxxx or v1.0.0)"
        required: true
        default: "latest"
      batch_image_tag:
        description: "Batch image tag (sha-xxxx or v1.0.0)"
        required: true
        default: "latest"
      airflow_image_tag:
        description: "Airflow image tag (sha-xxxx or v1.0.0)"
        required: true
        default: "latest"

jobs:
  prepare:
    name: Upload Manifests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      online_image: ${{ steps.tags.outputs.online_image }}
      batch_image: ${{ steps.tags.outputs.batch_image }}
      airflow_image: ${{ steps.tags.outputs.airflow_image }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the exact commit that triggered Release Images,
          # so manifests always match the built images.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLINE_TAG="${{ inputs.online_image_tag }}"
            BATCH_TAG="${{ inputs.batch_image_tag }}"
            AIRFLOW_TAG="${{ inputs.airflow_image_tag }}"
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            ONLINE_TAG="sha-${SHORT_SHA}"
            BATCH_TAG="sha-${SHORT_SHA}"
            AIRFLOW_TAG="sha-${SHORT_SHA}"
          fi
          OWNER="${{ github.repository_owner }}"
          echo "online_image=ghcr.io/${OWNER}/asr-online:${ONLINE_TAG}" >> "$GITHUB_OUTPUT"
          echo "batch_image=ghcr.io/${OWNER}/asr-batch:${BATCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "airflow_image=ghcr.io/${OWNER}/asr-airflow:${AIRFLOW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload K8s manifests and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/k8s,scripts/deploy/k8s_deploy.sh"
          target: ${{ secrets.REMOTE_APP_DIR }}
          strip_components: 0
          overwrite: true

  deploy:
    name: Deploy to Cluster
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Apply manifests and rollout
        uses: appleboy/ssh-action@v1.2.0
        env:
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          ONLINE_IMAGE: ${{ needs.prepare.outputs.online_image }}
          BATCH_IMAGE: ${{ needs.prepare.outputs.batch_image }}
          AIRFLOW_IMAGE: ${{ needs.prepare.outputs.airflow_image }}
          ASR_DB_USER: ${{ secrets.ASR_DB_USER }}
          ASR_DB_PASSWORD: ${{ secrets.ASR_DB_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REMOTE_APP_DIR,GHCR_USERNAME,GHCR_TOKEN,ONLINE_IMAGE,BATCH_IMAGE,AIRFLOW_IMAGE,ASR_DB_USER,ASR_DB_PASSWORD
          script: |
            chmod +x ${REMOTE_APP_DIR}/scripts/deploy/k8s_deploy.sh
            ${REMOTE_APP_DIR}/scripts/deploy/k8s_deploy.sh
