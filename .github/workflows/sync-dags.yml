name: Sync DAGs

on:
  push:
    branches: [main]
    paths:
      - "dags/**"
      - "deploy/k8s/base/airflow-dags-configmap.yaml"
      - ".github/workflows/sync-dags.yml"

jobs:
  sync:
    name: Apply DAG ConfigMap
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload updated ConfigMap
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "dags/nightly_batch.py"
          target: ${{ secrets.REMOTE_APP_DIR }}
          strip_components: 0
          overwrite: true

      - name: Apply ConfigMap and restart scheduler
        uses: appleboy/ssh-action@v1.2.0
        env:
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
          NAMESPACE: asr-system
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REMOTE_APP_DIR,NAMESPACE
          script: |
            export KUBECONFIG="${HOME}/.kube/config"
            DAG_FILE="${REMOTE_APP_DIR}/dags/nightly_batch.py"

            # Use the currently deployed batch image — no rebuild needed
            BATCH_IMAGE=$(kubectl get cronjob -n "${NAMESPACE}" \
              -o jsonpath='{.items[0].spec.jobTemplate.spec.template.spec.containers[0].image}' \
              2>/dev/null || echo "asr-batch:placeholder")

            echo "Applying DAG ConfigMap with image: ${BATCH_IMAGE}"
            kubectl create configmap airflow-dags \
              --namespace "${NAMESPACE}" \
              --from-file=nightly_batch.py="${DAG_FILE}" \
              --dry-run=client -o yaml \
              | sed "s|asr-batch:placeholder|${BATCH_IMAGE}|g" \
              | kubectl apply -f -

            kubectl -n "${NAMESPACE}" rollout restart deployment/airflow-scheduler
            kubectl -n "${NAMESPACE}" rollout status deployment/airflow-scheduler --timeout=120s
            echo "DAG sync complete"
