name: Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Rollback deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export KUBECONFIG="${HOME}/.kube/config"
            kubectl -n asr-system rollout undo deployment/asr-online
            kubectl -n asr-system rollout status deployment/asr-online --timeout=120s
            echo "Current image:"
            kubectl -n asr-system get deployment asr-online \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
            echo
            echo "Rollback completed"
