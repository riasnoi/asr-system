apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: ml-inference
  labels:
    app: triton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: triton
          image: triton-asr:placeholder
          args:
            - tritonserver
            - --model-repository=/models
            - --log-verbose=1
          env:
            # Кэш Hugging Face / hub на PVC (/models), чтобы веса не качались заново при новом поде
            - name: HF_HOME
              value: /models/hf_cache
            - name: HF_HUB_CACHE
              value: /models/hf_cache/hub
            - name: TRANSFORMERS_CACHE
              value: /models/hf_cache/transformers
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: triton-models-pvc
