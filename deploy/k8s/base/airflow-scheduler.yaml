apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: asr-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      serviceAccountName: airflow
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: scheduler
          image: asr-airflow:placeholder
          args: ["scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - airflow jobs check --job-type SchedulerJob --hostname $(hostname)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags/nightly_batch.py
              subPath: nightly_batch.py
            - name: logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: dags
          configMap:
            name: airflow-dags
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
