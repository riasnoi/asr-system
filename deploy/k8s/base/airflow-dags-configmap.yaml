apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: asr-system
data:
  nightly_batch.py: |
    from datetime import datetime, timedelta

    from airflow import DAG
    from airflow.providers.cncf.kubernetes.operators.pod import KubernetesPodOperator
    from kubernetes.client import (
        V1ConfigMapEnvSource,
        V1EnvFromSource,
        V1PersistentVolumeClaimVolumeSource,
        V1SecretEnvSource,
        V1Volume,
        V1VolumeMount,
    )

    default_args = {
        "owner": "ml-platform",
        "depends_on_past": False,
        "retries": 2,
        "retry_delay": timedelta(minutes=10),
    }

    with DAG(
        dag_id="nightly_asr_batch",
        description="Process call-center recordings for previous day",
        default_args=default_args,
        schedule="0 0 * * *",
        start_date=datetime(2026, 1, 1),
        catchup=False,
        max_active_runs=1,
        tags=["asr", "batch", "nightly"],
    ) as dag:
        run_batch = KubernetesPodOperator(
            task_id="run_batch_pipeline",
            name="asr-batch-run",
            namespace="asr-system",
            image="asr-batch:placeholder",
            cmds=["python", "services/batch/main.py"],
            env_from=[
                V1EnvFromSource(config_map_ref=V1ConfigMapEnvSource(name="asr-config")),
                V1EnvFromSource(secret_ref=V1SecretEnvSource(name="asr-vault-credentials")),
            ],
            volumes=[
                V1Volume(
                    name="data",
                    persistent_volume_claim=V1PersistentVolumeClaimVolumeSource(
                        claim_name="asr-data-pvc",
                    ),
                ),
            ],
            volume_mounts=[
                V1VolumeMount(name="data", mount_path="/app/data"),
            ],
            image_pull_secrets=["ghcr-pull-secret"],
            is_delete_operator_pod=True,
            get_logs=True,
            execution_timeout=timedelta(hours=7),
            sla=timedelta(hours=8),
        )
