apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-online
  namespace: asr-system
  labels:
    app: asr-online
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: asr-online
  template:
    metadata:
      labels:
        app: asr-online
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: online
          image: asr-online:placeholder
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: asr-config
            - secretRef:
                name: asr-vault-credentials
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asr-data-pvc
