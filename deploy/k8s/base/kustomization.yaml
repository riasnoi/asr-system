apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: asr-system

resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml is excluded — Vault credentials are created/updated by k8s_deploy.sh
  # to avoid overwriting pre-existing secrets with an empty template.
  - pvc.yaml
  - asr-db.yaml
  - online-deployment.yaml
  - online-service.yaml
  - online-hpa.yaml
  - ingress.yaml
  - batch-cronjob.yaml
  # Airflow
  - airflow-logs-pvc.yaml
  - airflow-rbac.yaml
  - airflow-configmap.yaml
  - airflow-dags-configmap.yaml
  - airflow-db.yaml
  - airflow-webserver.yaml
  - airflow-scheduler.yaml

# Image substitution is handled by sed in scripts/deploy/k8s_deploy.sh,
# which replaces *:placeholder tags in both pod specs and ConfigMap data.
