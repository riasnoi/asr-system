apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: asr-system
spec:
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: asr-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      serviceAccountName: airflow
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - bash
            - -c
            - |
              until pg_isready -h airflow-db -U airflow; do
                echo "Waiting for airflow-db..."
                sleep 3
              done
        - name: db-init
          image: asr-airflow:placeholder
          command: ["airflow", "db", "migrate"]
          envFrom:
            - configMapRef:
                name: airflow-config
        - name: create-admin
          image: asr-airflow:placeholder
          command:
            - bash
            - -c
            - |
              airflow users list | grep -q admin || \
              airflow users create \
                --username admin --password admin \
                --firstname Admin --lastname User \
                --role Admin --email admin@example.com
          envFrom:
            - configMapRef:
                name: airflow-config
      containers:
        - name: webserver
          image: asr-airflow:placeholder
          args: ["webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: airflow-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags/nightly_batch.py
              subPath: nightly_batch.py
            - name: logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: dags
          configMap:
            name: airflow-dags
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs-pvc
